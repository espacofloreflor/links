<title>Espaço Flor &amp; Flor</title>
<meta name="description" content="Locação de espaço, decoração e buffet para eventos íntimos em Natal/RN. Fale conosco no WhatsApp.">
<meta property="og:title" content="Espaço Flor &amp; Flor">
<meta property="og:description" content="Locação de espaço, decoração e buffet para eventos íntimos em Natal/RN.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#313A2D">

<!-- Tipografia secundária oficial da marca.
     A principal (Relationship of Mélodrame) não é usada aqui porque a página
     não tem títulos em display: o nome da marca vem do próprio logo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ESPAÇO RESERVADO: Meta Pixel / Google Analytics.
     Só inserir depois do aviso de privacidade (LGPD). -->

<style>
  :root {
    /* Paleta oficial da marca */
    --verde-escuro: #313A2D;
    --verde-oliva:  #44503E;
    --amarelo:      #FFD993;
    --bege:         #FFE8BB;

    --borda: rgba(255, 232, 187, 0.18);
    --raio: 16px;
    --largura: 440px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* O fundo do html é o que aparece quando o iPhone "estica" a página
     ao puxar para atualizar. Ele tem a mesma cor do topo do véu,
     então não há emenda visível. */
  html {
    background: var(--verde-escuro);
    overscroll-behavior-y: none;
  }

  body {
    font-family: "Parkinsans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--bege);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 44px 24px 0;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     FUNDO
     Fica fixo: a foto não rola junto com os botões.
     A foto e o logo estão embutidos no próprio arquivo (base64),
     então a página funciona sozinha, sem arquivos ao lado.

     Para trocar a foto: no HTML, dentro de <div class="fundo">,
     substitua o conteúdo do atributo src da imagem pelo nome de um
     arquivo (ex.: foto-fundo.jpg) e publique esse arquivo na mesma pasta.

     Ajustes finos:
       brightness       mais baixo escurece a foto
       object-position  qual faixa da foto aparece em telas largas
     ============================================================ */
  .fundo {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--verde-escuro);
    overflow: hidden;
  }

  .fundo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Dessaturação parcial + escurecimento puxam a foto para o verde da marca */
    object-position: center 62%;
    filter: grayscale(0.15) brightness(0.8);
  }

  /* Véu em gradiente, mesmo tratamento dos materiais de Instagram.
     Garante legibilidade do texto por cima de qualquer foto. */
  .fundo::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(49, 58, 45, 1) 0%,
        rgba(49, 58, 45, 0.94) 9%,
        rgba(49, 58, 45, 0.84) 22%,
        rgba(49, 58, 45, 0.50) 40%,
        rgba(49, 58, 45, 0.34) 62%,
        rgba(49, 58, 45, 0.84) 100%);
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: var(--largura);
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* ---------- Cabeçalho ---------- */
  header { text-align: center; margin-bottom: 36px; }

  .logo {
    width: 100%;
    max-width: 210px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 2px 14px rgba(24, 30, 22, 0.75));
  }

  .tagline {
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 232, 187, 0.82);
    margin-top: 18px;
  }

  /* Filete fino com losango central, ecoando o separador do manual */
  .filete {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
  }
  .filete span { height: 1px; width: 46px; background: var(--borda); }
  .filete i {
    width: 4px; height: 4px;
    background: var(--amarelo);
    transform: rotate(45deg);
    opacity: .75;
  }

  /* ---------- Botões ---------- */
  .links { display: flex; flex-direction: column; gap: 14px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 16px;
    /* Translúcido para a foto aparecer por trás sem comprometer a leitura */
    background: rgba(49, 58, 45, 0.80);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 18px 20px;
    text-decoration: none;
    color: var(--bege);
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }

  .btn:hover {
    background: rgba(68, 80, 62, 0.92);
    border-color: rgba(255, 217, 147, .5);
    transform: translateY(-2px);
  }

  .btn:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 3px; }

  /* Destaque reservado ao WhatsApp, o CTA principal */
  .btn.destaque {
    background: var(--amarelo);
    border-color: var(--amarelo);
    color: var(--verde-escuro);
  }
  .btn.destaque:hover { background: var(--bege); border-color: var(--bege); }
  .btn.destaque .btn-sub { color: rgba(49, 58, 45, .72); }

  /* Todos os ícones são de traço, com o mesmo peso de linha */
  .btn-icone, .btn .seta {
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .btn-icone { width: 22px; height: 22px; }
  .btn-texto { flex: 1; min-width: 0; }

  .btn-titulo {
    display: block;
    font-size: 0.93rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .btn-sub {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    color: rgba(255, 232, 187, .62);
    margin-top: 3px;
  }

  .btn .seta { width: 15px; height: 15px; opacity: .5; }

  /* Botão ainda sem destino ativo */
  .btn.inativo {
    opacity: .6;
    cursor: default;
    pointer-events: none;
    background: rgba(49, 58, 45, 0.55);
    border-style: dashed;
  }

  /* ---------- Rodapé ---------- */
  footer {
    margin-top: auto;
    padding: 48px 0 32px;
    text-align: center;
    font-size: 0.72rem;
    line-height: 1.9;
    color: rgba(255, 232, 187, .72);
    text-shadow: 0 1px 10px rgba(30, 36, 28, .9);
  }

  footer strong {
    display: block;
    font-weight: 500;
    color: var(--bege);
    margin-bottom: 4px;
  }

  @media (max-width: 380px) {
    .logo { max-width: 190px; }
    .btn { padding: 16px; gap: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
